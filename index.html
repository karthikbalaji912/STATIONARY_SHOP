<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends Glory Stationery</title>
    <style>
        /* --- Reset & Core Layout --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0719;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            cursor: default;
        }

        /* --- Background Layers (z-index: 0) --- */
        #bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }
        .balaji-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 25%; /* Keeps face completely visible */
            user-select: none;
        }
        .bg-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, rgba(10, 5, 30, 0.1) 0%, rgba(5, 2, 20, 0.6) 100%);
        }

        /* --- Atmosphere: Stars, Rays, Fog, Diyas, Temple (z-index: 1) --- */
        .atmosphere {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        /* Divine Beam from Forehead */
        .divine-beam {
            position: absolute;
            top: 0;
            left: 50%;
            width: 60%;
            height: 120%;
            transform: translateX(-50%);
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.25) 0%, rgba(255, 220, 150, 0.05) 50%, transparent 90%);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            mix-blend-mode: soft-light;
            opacity: 0.4;
            animation: beamPulse 6s ease-in-out infinite alternate;
        }
        @keyframes beamPulse {
            0% { opacity: 0.2; transform: translateX(-50%) scaleX(0.9); }
            100% { opacity: 0.6; transform: translateX(-50%) scaleX(1.1); }
        }

        /* Stars */
        .stars { position: absolute; inset: 0; }

        /* Divine Fog */
        .fog {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 30% 80%, rgba(150, 180, 255, 0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 70%, rgba(200, 180, 255, 0.05) 0%, transparent 50%);
            filter: blur(40px);
            animation: fogDrift 30s ease-in-out infinite alternate;
        }
        @keyframes fogDrift {
            0% { transform: scale(1) translateX(-20px); }
            100% { transform: scale(1.1) translateX(20px); }
        }

        /* Temple Silhouettes (SVG) */
        .temple-silhouettes {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            opacity: 0.3;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
        }
        .temple-silhouettes svg {
            width: 200px;
            height: 300px;
            fill: #050210;
        }

        /* Floating Diyas */
        .diya {
            position: absolute;
            width: 20px;
            height: 30px;
            animation: floatDiya 12s linear infinite alternate;
        }
        .diya:nth-child(1) { left: 10%; bottom: 20%; animation-delay: 0s; }
        .diya:nth-child(2) { left: 85%; bottom: 35%; animation-delay: 4s; width: 15px; height: 22px; }
        .diya:nth-child(3) { left: 20%; bottom: 50%; animation-delay: 8s; width: 12px; height: 18px; }
        .diya:nth-child(4) { left: 70%; bottom: 60%; animation-delay: 2s; width: 18px; height: 25px; }
        
        @keyframes floatDiya {
            0% { transform: translateY(0px) rotate(-5deg) scale(1); opacity: 0.4; }
            50% { opacity: 1; }
            100% { transform: translateY(-30px) rotate(5deg) scale(1.05); opacity: 0.6; }
        }

        /* --- Logo & Mandala Center (z-index: 10) --- */
        #center-area {
            position: absolute;
            top: 80%; /* Positioned exactly below chest / around waist */
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.5s ease;
        }

        /* Mandala Halo */
        #halo-mandala {
            position: absolute;
            width: 30vmin;
            height: 30vmin;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.15) 0%, rgba(255, 215, 0, 0.05) 40%, transparent 70%);
            animation: spin 60s linear infinite;
            pointer-events: none;
        }
        #halo-mandala::before {
            content: '';
            position: absolute;
            inset: -10%;
            border-radius: 50%;
            border: 1px solid rgba(255, 215, 0, 0.1);
            animation: spin 40s linear infinite reverse;
        }
        #halo-mandala::after {
            content: '';
            position: absolute;
            inset: -25%;
            border-radius: 50%;
            border: 1px dashed rgba(255, 215, 0, 0.05);
            animation: spin 80s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Rotating Sacred Light Ring */
        #sacred-ring {
            position: absolute;
            width: 42vmin;
            height: 42vmin;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top: 2px solid rgba(255, 215, 0, 0.3);
            border-left: 2px solid rgba(255, 215, 0, 0.1);
            animation: spin 25s linear infinite;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.2));
        }

        /* Soft Golden Bloom */
        #golden-bloom {
            position: absolute;
            width: 20vmin;
            height: 20vmin;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, transparent 70%);
            filter: blur(30px);
            animation: bloomPulse 4s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes bloomPulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* Logo Img */
        #logo-img {
            width: 60vmin;
            height: 60vmin;
            object-fit: contain;
            position: relative;
            z-index: 2;
            animation: breathe 4s ease-in-out infinite;
            filter: drop-shadow(0 0 25px rgba(255, 215, 0, 0.5)) drop-shadow(0 10px 30px rgba(0,0,0,0.5));
            transition: filter 0.5s ease, transform 0.5s ease;
        }
        @keyframes breathe {
            0% { transform: scale(1.00); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1.00); }
        }

        /* --- Hover Interactions --- */
        #center-area:hover {
            cursor: pointer;
        }
        #center-area:hover #logo-img {
            filter: drop-shadow(0 0 45px rgba(255, 215, 0, 0.9)) drop-shadow(0 15px 40px rgba(0,0,0,0.6)) brightness(1.1);
            animation-duration: 2.5s;
        }
        #center-area:hover #halo-mandala {
            animation-duration: 30s;
        }
        #center-area:hover #halo-mandala::before {
            animation-duration: 20s;
        }
        #center-area:hover #sacred-ring {
            animation-duration: 15s;
        }
        #center-area:hover #golden-bloom {
            transform: scale(1.5);
            filter: blur(20px);
        }

        /* --- Particle Canvas (z-index: 5) --- */
        #particles-canvas {
            position: fixed;
            inset: 0;
            z-index: 5;
            pointer-events: none;
        }

        /* --- Click Flash Effect --- */
        #flash-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.8s ease-in;
        }
        #flash-overlay.active {
            opacity: 1;
        }

        /* --- Responsive Tweaks --- */
        @media (max-width: 768px) {
            #center-area { top: 60%; }
            #logo-img { width: 30vmin; height: 30vmin; }
            #halo-mandala { width: 60vmin; height: 60vmin; }
            #sacred-ring { width: 45vmin; height: 45vmin; }
            .temple-silhouettes svg { width: 120px; height: 180px; }
        }
        @media (max-width: 480px) {
            #center-area { top: 55%; }
            #logo-img { width: 40vmin; height: 40vmin; }
            #halo-mandala { width: 70vmin; height: 70vmin; }
            .divine-beam { width: 80%; }
        }
    </style>
</head>
<body>

    <!-- 1. Background Layer -->
    <div id="bg-layer">
        <img src="balaji.png" class="balaji-bg" alt="Lord Venkateswara">
        <div class="bg-overlay"></div>
    </div>

    <!-- 2. Atmosphere & Divine Elements -->
    <div class="atmosphere">
        <!-- Heavenly Light Beam -->
        <div class="divine-beam"></div>
        <div class="stars" id="stars-container"></div>
        <div class="fog"></div>
        
        <!-- Floating Diyas -->
        <div class="diya">
            <svg viewBox="0 0 100 120" fill="none">
                <path d="M50 30 L70 70 L30 70 Z" fill="#ffb347" opacity="0.8"/>
                <ellipse cx="50" cy="70" rx="30" ry="8" fill="#8b4513"/>
                <path d="M50 30 Q55 40 55 50 Q55 60 50 70 Q45 60 45 50 Q45 40 50 30 Z" fill="#ffeb3b" opacity="0.9"/>
                <path d="M50 30 Q52 35 52 45 Q52 55 50 60 Q48 55 48 45 Q48 35 50 30 Z" fill="#ffffff" opacity="0.8"/>
            </svg>
        </div>
        <div class="diya">
            <svg viewBox="0 0 100 120" fill="none">
                <path d="M50 30 L70 70 L30 70 Z" fill="#ffb347" opacity="0.8"/>
                <ellipse cx="50" cy="70" rx="30" ry="8" fill="#8b4513"/>
                <path d="M50 30 Q55 40 55 50 Q55 60 50 70 Q45 60 45 50 Q45 40 50 30 Z" fill="#ffeb3b" opacity="0.9"/>
                <path d="M50 30 Q52 35 52 45 Q52 55 50 60 Q48 55 48 45 Q48 35 50 30 Z" fill="#ffffff" opacity="0.8"/>
            </svg>
        </div>
        <div class="diya">
            <svg viewBox="0 0 100 120" fill="none">
                <path d="M50 30 L70 70 L30 70 Z" fill="#ffb347" opacity="0.8"/>
                <ellipse cx="50" cy="70" rx="30" ry="8" fill="#8b4513"/>
                <path d="M50 30 Q55 40 55 50 Q55 60 50 70 Q45 60 45 50 Q45 40 50 30 Z" fill="#ffeb3b" opacity="0.9"/>
                <path d="M50 30 Q52 35 52 45 Q52 55 50 60 Q48 55 48 45 Q48 35 50 30 Z" fill="#ffffff" opacity="0.8"/>
            </svg>
        </div>
        <div class="diya">
            <svg viewBox="0 0 100 120" fill="none">
                <path d="M50 30 L70 70 L30 70 Z" fill="#ffb347" opacity="0.8"/>
                <ellipse cx="50" cy="70" rx="30" ry="8" fill="#8b4513"/>
                <path d="M50 30 Q55 40 55 50 Q55 60 50 70 Q45 60 45 50 Q45 40 50 30 Z" fill="#ffeb3b" opacity="0.9"/>
                <path d="M50 30 Q52 35 52 45 Q52 55 50 60 Q48 55 48 45 Q48 35 50 30 Z" fill="#ffffff" opacity="0.8"/>
            </svg>
        </div>

        <!-- Temple Silhouettes -->
        <div class="temple-silhouettes">
            <svg viewBox="0 0 200 300">
                <path d="M100,0 L130,80 L180,80 L180,300 L20,300 L20,80 L70,80 Z" />
                <path d="M100,0 L120,60 L160,60 L160,300 L40,300 L40,60 L80,60 Z" fill="#0b0719"/>
                <path d="M100,0 L110,40 L140,40 L140,300 L60,300 L60,40 L90,40 Z" />
            </svg>
            <svg viewBox="0 0 200 300">
                <path d="M100,0 L130,80 L180,80 L180,300 L20,300 L20,80 L70,80 Z" />
                <path d="M100,0 L120,60 L160,60 L160,300 L40,300 L40,60 L80,60 Z" fill="#0b0719"/>
                <path d="M100,0 L110,40 L140,40 L140,300 L60,300 L60,40 L90,40 Z" />
            </svg>
        </div>
    </div>

    <!-- 3. Logo & Divine Centerpiece -->
    <div id="center-area">
        <div id="halo-mandala"></div>
        <div id="sacred-ring"></div>
        <div id="golden-bloom"></div>
        <img src="glory.png" id="logo-img" alt="Friends Glory Stationery Store">
    </div>

    <!-- 4. Particle Canvas -->
    <canvas id="particles-canvas"></canvas>

    <!-- 5. Transition Effects -->
    <div id="flash-overlay"></div>
    <audio id="clickSound" src="sounds/click.mp3" preload="auto"></audio>

    <script>
        (function() {
            'use strict';

            // 1. Generate Stars
            const starsContainer = document.getElementById('stars-container');
            const fragment = document.createDocumentFragment();
            for (let i = 0; i < 150; i++) {
                const star = document.createElement('div');
                const size = 0.5 + Math.random() * 2.5;
                star.style.cssText = `
                    position: absolute;
                    width: ${size}px;
                    height: ${size}px;
                    background: #fff;
                    border-radius: 50%;
                    top: ${Math.random() * 100}%;
                    left: ${Math.random() * 100}%;
                    opacity: ${0.1 + Math.random() * 0.8};
                    animation: ${Math.random() > 0.5 ? 'starTwinkle' : ''} ${2 + Math.random() * 4}s infinite alternate;
                    box-shadow: 0 0 ${size * 2}px rgba(255, 255, 255, 0.3);
                `;
                fragment.appendChild(star);
            }
            starsContainer.appendChild(fragment);
            
            // Star CSS Keyframe added via JS to keep HTML clean
            const styleSheet = document.createElement("style");
            styleSheet.textContent = `
                @keyframes starTwinkle {
                    0% { opacity: 0.1; transform: scale(0.8); }
                    100% { opacity: 1; transform: scale(1.2); }
                }
            `;
            document.head.appendChild(styleSheet);

            // 2. Particle Canvas Logic
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            let mouseX = -1000, mouseY = -1000;
            let isHovering = false;

            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            const centerArea = document.getElementById('center-area');
            
            centerArea.addEventListener('mouseenter', () => { 
                isHovering = true; 
                document.body.style.cursor = 'pointer';
            });
            centerArea.addEventListener('mouseleave', () => { 
                isHovering = false; 
                document.body.style.cursor = 'default';
            });
            
            document.addEventListener('mousemove', (e) => {
                const rect = centerArea.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right &&
                    e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                } else {
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                }
            });

            function getParticleCount() {
                if (width < 480) return 40;
                if (width < 768) return 80;
                return 150;
            }

            class Particle {
                constructor() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = 1 + Math.random() * 4;
                    this.vx = (Math.random() - 0.5) * 0.2;
                    this.vy = (Math.random() - 0.5) * 0.2 - 0.05;
                    this.life = 0;
                    this.maxLife = 200 + Math.random() * 400;
                    this.originX = this.x;
                    this.originY = this.y;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.life++;

                    // Hover effect - Pull particles towards logo
                    if (isHovering && this.life % 5 === 0) {
                        const dx = mouseX - this.x;
                        const dy = mouseY - this.y;
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 300) {
                            this.vx += dx * 0.0005;
                            this.vy += dy * 0.0005;
                        }
                    }

                    // Limit speed
                    const maxSpeed = isHovering ? 1.5 : 0.4;
                    if (Math.abs(this.vx) > maxSpeed) this.vx *= 0.98;
                    if (Math.abs(this.vy) > maxSpeed) this.vy *= 0.98;

                    // Reset if out of bounds or life expired
                    if (this.x < -50 || this.x > width + 50 || this.y < -50 || this.y > height + 50 || this.life > this.maxLife) {
                        this.x = Math.random() * width;
                        this.y = Math.random() * height;
                        this.vx = (Math.random() - 0.5) * 0.2;
                        this.vy = (Math.random() - 0.5) * 0.2 - 0.05;
                        this.life = 0;
                        this.maxLife = 200 + Math.random() * 400;
                    }
                }
                draw() {
                    const alpha = Math.min(this.life / 100, 1) * (0.4 + Math.random() * 0.6);
                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 4);
                    
                    let intensity = isHovering ? 1 : 0.6;
                    gradient.addColorStop(0, `rgba(255, 215, 0, ${alpha * intensity})`);
                    gradient.addColorStop(0.3, `rgba(255, 200, 100, ${alpha * intensity * 0.5})`);
                    gradient.addColorStop(1, 'rgba(255, 200, 100, 0)');

                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 4, 0, Math.PI * 2);
                    ctx.fillStyle = gradient;
                    ctx.fill();

                    // Bright core
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 230, ${alpha * 0.8})`;
                    ctx.fill();
                }
            }

            function initParticles() {
                particles = [];
                const count = getParticleCount();
                for (let i = 0; i < count; i++) {
                    particles.push(new Particle());
                }
            }
            initParticles();

            function animate() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animate);
            }
            animate();

            // 3. Click Interaction
            const clickSound = document.getElementById('clickSound');
            const flashOverlay = document.getElementById('flash-overlay');

            centerArea.addEventListener('click', () => {
                // Play Sound
                if (clickSound) {
                    clickSound.currentTime = 0;
                    clickSound.play().catch(() => {});
                }
                
                // Trigger Golden Flash & Fade
                flashOverlay.classList.add('active');
                
                // Redirect to Stationary Store
                setTimeout(() => {
                    window.location.href = 'stationary.html';
                }, 1500);
            });

        })();
    </script>
</body>
</html>
