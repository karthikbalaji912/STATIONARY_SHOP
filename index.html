<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glory Select</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-burgundy: #6b0f1a;
            --color-burgundy-dark: #4a0a12;
            --color-coral: #ff8a8a;
            --color-gold: #ffbf69;
            --color-gold-glow: rgba(255, 191, 105, 0.35);
            --color-glass: rgba(255, 255, 255, 0.28);
            --color-glass-light: rgba(255, 255, 255, 0.50);
            --font-display: 'Outfit', 'Segoe UI', Arial, sans-serif;
            --font-body: 'Poppins', 'Segoe UI', Arial, sans-serif;
            --shadow-card: 0 18px 50px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.10);
            --shadow-card-hover: 0 30px 70px rgba(0, 0, 0, 0.60), 0 0 0 1.5px rgba(255, 255, 255, 0.45);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease-smooth: cubic-bezier(0.21, 0.8, 0.33, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--color-burgundy-dark);
            font-family: var(--font-body);
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #bg-layer {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .sky {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at 30% 10%, #b84a4a 0%, #6b0f1a 45%, #2d0510 85%);
            animation: skyPulse 18s ease-in-out infinite alternate;
        }
        @keyframes skyPulse {
            0% {
                background: radial-gradient(ellipse at 30% 10%, #b84a4a 0%, #6b0f1a 45%, #2d0510 85%);
            }
            50% {
                background: radial-gradient(ellipse at 60% 20%, #d45a5a 0%, #7a1420 40%, #3a0812 80%);
            }
            100% {
                background: radial-gradient(ellipse at 20% 5%, #c94f4f 0%, #5e0e18 50%, #1f050b 90%);
            }
        }

        .aurora {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 10% 20%, rgba(100, 200, 255, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 90% 30%, rgba(255, 150, 200, 0.06) 0%, transparent 40%),
                radial-gradient(ellipse at 50% 10%, rgba(255, 220, 150, 0.05) 0%, transparent 60%);
            animation: auroraDrift 24s ease-in-out infinite alternate;
        }
        @keyframes auroraDrift {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 0.6;
            }
            50% {
                transform: translate(30px, -20px) scale(1.1) rotate(2deg);
                opacity: 1;
            }
            100% {
                transform: translate(-20px, 10px) scale(0.95) rotate(-2deg);
                opacity: 0.7;
            }
        }

        .light-rays {
            position: absolute;
            inset: 0;
            background:
                repeating-linear-gradient(45deg,
                    rgba(255, 220, 160, 0.03) 0px,
                    rgba(255, 220, 160, 0.03) 40px,
                    transparent 40px,
                    transparent 80px),
                repeating-linear-gradient(-30deg,
                    rgba(255, 200, 120, 0.02) 0px,
                    rgba(255, 200, 120, 0.02) 60px,
                    transparent 60px,
                    transparent 120px);
            animation: raysRotate 60s linear infinite;
        }
        @keyframes raysRotate {
            0% {
                transform: rotate(0deg) scale(1.2);
            }
            100% {
                transform: rotate(360deg) scale(1.2);
            }
        }

        .clouds {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .cloud {
            position: absolute;
            border-radius: 9999px;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.10) 0%, transparent 70%);
            filter: blur(28px);
            animation: cloudFloat linear infinite alternate;
        }
        .cloud-1 {
            width: 600px;
            height: 140px;
            top: 6%;
            left: -8%;
            animation-duration: 38s;
            animation-delay: 0s;
            opacity: 0.5;
        }
        .cloud-2 {
            width: 800px;
            height: 180px;
            top: 18%;
            right: -12%;
            animation-duration: 44s;
            animation-delay: 6s;
            opacity: 0.35;
        }
        .cloud-3 {
            width: 500px;
            height: 120px;
            top: 40%;
            left: 10%;
            animation-duration: 32s;
            animation-delay: 12s;
            opacity: 0.25;
        }
        @keyframes cloudFloat {
            0% {
                transform: translateX(-40px) scale(1);
            }
            100% {
                transform: translateX(60px) scale(1.08);
            }
        }

        .waterfall-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .waterfall {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        .fall {
            position: absolute;
            top: -10%;
            width: 6px;
            height: 120%;
            border-radius: 50px;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.0) 0%,
                    rgba(180, 220, 255, 0.08) 15%,
                    rgba(200, 235, 255, 0.18) 40%,
                    rgba(255, 255, 255, 0.25) 60%,
                    rgba(180, 220, 255, 0.10) 80%,
                    rgba(255, 255, 255, 0.0) 100%);
            animation: fallDown linear infinite;
            filter: blur(2px);
        }
        .fall:nth-child(1) {
            left: 8%;
            width: 8px;
            animation-duration: 2.8s;
            animation-delay: 0.0s;
            opacity: 0.4;
        }
        .fall:nth-child(2) {
            left: 16%;
            width: 4px;
            animation-duration: 3.2s;
            animation-delay: 0.7s;
            opacity: 0.5;
        }
        .fall:nth-child(3) {
            left: 24%;
            width: 12px;
            animation-duration: 2.4s;
            animation-delay: 0.3s;
            opacity: 0.35;
        }
        .fall:nth-child(4) {
            left: 35%;
            width: 5px;
            animation-duration: 3.6s;
            animation-delay: 1.0s;
            opacity: 0.45;
        }
        .fall:nth-child(5) {
            left: 44%;
            width: 10px;
            animation-duration: 2.0s;
            animation-delay: 0.2s;
            opacity: 0.3;
        }
        .fall:nth-child(6) {
            left: 55%;
            width: 7px;
            animation-duration: 3.0s;
            animation-delay: 0.9s;
            opacity: 0.5;
        }
        .fall:nth-child(7) {
            left: 66%;
            width: 4px;
            animation-duration: 2.6s;
            animation-delay: 0.5s;
            opacity: 0.4;
        }
        .fall:nth-child(8) {
            left: 76%;
            width: 14px;
            animation-duration: 3.4s;
            animation-delay: 0.1s;
            opacity: 0.3;
        }
        .fall:nth-child(9) {
            left: 86%;
            width: 6px;
            animation-duration: 2.2s;
            animation-delay: 0.8s;
            opacity: 0.45;
        }
        .fall:nth-child(10) {
            left: 94%;
            width: 8px;
            animation-duration: 3.8s;
            animation-delay: 0.4s;
            opacity: 0.35;
        }
        .fall-wide {
            position: absolute;
            top: -10%;
            height: 120%;
            border-radius: 100px;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.0) 0%,
                    rgba(160, 210, 255, 0.06) 20%,
                    rgba(200, 235, 255, 0.14) 45%,
                    rgba(255, 255, 255, 0.20) 65%,
                    rgba(160, 210, 255, 0.06) 85%,
                    rgba(255, 255, 255, 0.0) 100%);
            animation: fallDown linear infinite;
            filter: blur(4px);
        }
        .fall-wide:nth-child(11) {
            left: 3%;
            width: 30px;
            animation-duration: 4.0s;
            animation-delay: 0.0s;
            opacity: 0.25;
        }
        .fall-wide:nth-child(12) {
            left: 48%;
            width: 40px;
            animation-duration: 4.6s;
            animation-delay: 0.6s;
            opacity: 0.20;
        }
        .fall-wide:nth-child(13) {
            left: 70%;
            width: 35px;
            animation-duration: 3.8s;
            animation-delay: 0.3s;
            opacity: 0.22;
        }
        @keyframes fallDown {
            0% {
                transform: translateY(-10%) scaleY(0.9);
                opacity: 0.2;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                transform: translateY(110%) scaleY(1.1);
                opacity: 0.1;
            }
        }

        .mist {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .mist-layer {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            background: radial-gradient(ellipse at center, rgba(200, 220, 255, 0.10) 0%, transparent 70%);
            animation: mistDrift linear infinite alternate;
        }
        .mist-layer-1 {
            width: 900px;
            height: 300px;
            bottom: -40px;
            left: -100px;
            animation-duration: 22s;
            animation-delay: 0s;
            opacity: 0.5;
        }
        .mist-layer-2 {
            width: 700px;
            height: 250px;
            bottom: 20px;
            right: -80px;
            animation-duration: 26s;
            animation-delay: 4s;
            opacity: 0.35;
            background: radial-gradient(ellipse at center, rgba(255, 200, 180, 0.08) 0%, transparent 70%);
        }
        .mist-layer-3 {
            width: 1100px;
            height: 200px;
            bottom: -60px;
            left: 20%;
            animation-duration: 30s;
            animation-delay: 8s;
            opacity: 0.30;
            filter: blur(80px);
        }
        @keyframes mistDrift {
            0% {
                transform: translateX(-60px) scale(1);
            }
            100% {
                transform: translateX(80px) scale(1.12);
            }
        }

        .ripples {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35%;
            pointer-events: none;
            overflow: hidden;
        }
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.06) 0%, transparent 60%);
            animation: rippleExpand linear infinite;
            transform-origin: center;
        }
        .ripple-1 {
            width: 300px;
            height: 80px;
            bottom: 10%;
            left: 5%;
            animation-duration: 5.0s;
            animation-delay: 0.0s;
            opacity: 0.3;
        }
        .ripple-2 {
            width: 450px;
            height: 100px;
            bottom: 20%;
            left: 30%;
            animation-duration: 6.2s;
            animation-delay: 1.2s;
            opacity: 0.25;
        }
        .ripple-3 {
            width: 350px;
            height: 90px;
            bottom: 5%;
            left: 55%;
            animation-duration: 5.8s;
            animation-delay: 2.4s;
            opacity: 0.20;
        }
        .ripple-4 {
            width: 500px;
            height: 120px;
            bottom: 15%;
            left: 75%;
            animation-duration: 7.0s;
            animation-delay: 0.8s;
            opacity: 0.18;
        }
        @keyframes rippleExpand {
            0% {
                transform: scaleX(0.3) scaleY(0.1) translateY(0);
                opacity: 0.1;
            }
            50% {
                opacity: 0.4;
            }
            100% {
                transform: scaleX(1.8) scaleY(0.6) translateY(-40px);
                opacity: 0;
            }
        }

        .reflection {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 28%;
            background: linear-gradient(180deg,
                    rgba(255, 255, 255, 0.0) 0%,
                    rgba(180, 200, 220, 0.04) 30%,
                    rgba(200, 220, 240, 0.06) 60%,
                    rgba(255, 255, 255, 0.02) 100%);
            filter: blur(10px);
            animation: reflectionPulse 8s ease-in-out infinite alternate;
        }
        @keyframes reflectionPulse {
            0% {
                opacity: 0.4;
                transform: scaleY(0.95);
            }
            100% {
                opacity: 0.8;
                transform: scaleY(1.05);
            }
        }

        #particles-canvas {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            width: 100%;
            height: 100%;
        }

        #cursor-glow {
            position: fixed;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(255, 191, 105, 0.12) 0%, rgba(255, 138, 138, 0.05) 40%, transparent 70%);
            pointer-events: none;
            z-index: 2;
            transform: translate(-50%, -50%);
            will-change: transform, opacity;
            transition: opacity 0.3s ease;
            filter: blur(20px);
            opacity: 0;
        }
        #cursor-glow.visible {
            opacity: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            display: flex;
            gap: 40px;
            padding: 20px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            animation: containerFadeIn 1.8s ease forwards;
            opacity: 0;
        }
        @keyframes containerFadeIn {
            0% {
                opacity: 0;
                transform: translateY(60px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .shop-card {
            position: relative;
            width: 300px;
            background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.30), rgba(255, 255, 255, 0.06));
            border-radius: 28px;
            padding: 26px 22px 28px;
            text-align: center;
            backdrop-filter: blur(20px) saturate(160%);
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.22);
            box-shadow: var(--shadow-card);
            transition:
                transform 0.6s var(--ease-spring),
                box-shadow 0.6s var(--ease-smooth),
                background 0.5s ease,
                border-color 0.5s ease;
            transform-style: preserve-3d;
            will-change: transform;
            animation: cardFloat 6s ease-in-out infinite alternate;
            overflow: visible;
        }
        .shop-card::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 28px;
            padding: 1.5px;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.50) 0%,
                    rgba(255, 255, 255, 0.05) 40%,
                    rgba(255, 255, 255, 0.02) 60%,
                    rgba(255, 255, 255, 0.30) 100%);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
            transition: opacity 0.5s ease;
            opacity: 0.6;
        }
        .shop-card::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 28px;
            background: linear-gradient(135deg,
                    rgba(255, 255, 255, 0.20) 0%,
                    transparent 40%,
                    transparent 70%,
                    rgba(255, 255, 255, 0.08) 100%);
            pointer-events: none;
            transition: opacity 0.6s ease, transform 0.8s ease;
            opacity: 0.3;
            transform: translateX(-30%) rotate(10deg);
        }

        .shop-card .glass-streak {
            position: absolute;
            inset: 0;
            border-radius: 28px;
            background: linear-gradient(120deg,
                    rgba(255, 255, 255, 0.0) 0%,
                    rgba(255, 255, 255, 0.0) 30%,
                    rgba(255, 255, 255, 0.25) 50%,
                    rgba(255, 255, 255, 0.0) 70%,
                    rgba(255, 255, 255, 0.0) 100%);
            pointer-events: none;
            mix-blend-mode: soft-light;
            transition: transform 0.8s cubic-bezier(0.21, 0.8, 0.33, 1), opacity 0.6s ease;
            transform: translateX(-100%) skewX(-20deg);
            opacity: 0;
        }

        @keyframes cardFloat {
            0% {
                transform: translateY(0px) rotateX(0.5deg) rotateY(0.5deg);
            }
            100% {
                transform: translateY(-18px) rotateX(-0.5deg) rotateY(-0.5deg);
            }
        }

        .shop-card:hover {
            transform: translateY(-18px) scale(1.05) rotateX(6deg) rotateY(8deg) !important;
            background: radial-gradient(circle at top left, rgba(255, 255, 255, 0.50), rgba(255, 255, 255, 0.10));
            box-shadow: var(--shadow-card-hover), 0 0 40px rgba(255, 191, 105, 0.15);
            border-color: rgba(255, 255, 255, 0.55);
            animation-play-state: paused;
        }
        .shop-card:hover::before {
            opacity: 1;
        }
        .shop-card:hover::after {
            opacity: 0.6;
            transform: translateX(20%) rotate(10deg);
        }
        .shop-card:hover .glass-streak {
            transform: translateX(80%) skewX(-20deg);
            opacity: 0.6;
        }
        .shop-card:active {
            transform: translateY(-8px) scale(1.02) rotateX(2deg) rotateY(3deg) !important;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 0 1.5px rgba(255, 255, 255, 0.50);
        }

        .shop-card img {
            width: 100%;
            height: 190px;
            border-radius: 20px;
            object-fit: cover;
            margin-bottom: 16px;
            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.40),
                0 0 0 1px rgba(255, 255, 255, 0.12);
            transition: transform 0.6s var(--ease-spring), box-shadow 0.5s ease;
            will-change: transform;
            position: relative;
            z-index: 1;
        }
        .shop-card:hover img {
            transform: scale(1.04) translateY(-4px);
            box-shadow:
                0 14px 36px rgba(0, 0, 0, 0.50),
                0 0 0 2px rgba(255, 255, 255, 0.20);
        }

        .shop-title {
            font-family: var(--font-display);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #fff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.50);
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #ffdbb5 50%, #ffb88a 100%);
            background-clip: text;
            -webkit-text-fill-color: transparent;
            transition: transform 0.4s ease;
        }
        .shop-card:hover .shop-title {
            transform: scale(1.02);
        }

        .shop-subtitle {
            font-family: var(--font-body);
            font-size: 16px;
            font-weight: 400;
            opacity: 0.85;
            color: #f2e8ff;
            text-shadow: 0 1px 8px rgba(0, 0, 0, 0.30);
            letter-spacing: 0.3px;
            transition: opacity 0.4s ease;
        }
        .shop-card:hover .shop-subtitle {
            opacity: 1;
        }

        .floating-ornament {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(40px);
            opacity: 0.15;
            animation: ornamentFloat 20s ease-in-out infinite alternate;
        }
        .floating-ornament-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 191, 105, 0.3), transparent);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }
        .floating-ornament-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 138, 138, 0.2), transparent);
            bottom: -50px;
            left: -50px;
            animation-delay: 7s;
        }
        .floating-ornament-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(180, 220, 255, 0.15), transparent);
            top: 40%;
            left: 60%;
            animation-delay: 14s;
        }
        @keyframes ornamentFloat {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(40px, -30px) scale(1.15);
            }
        }

        .glow-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            border: 1px solid rgba(255, 191, 105, 0.06);
            animation: ringPulse 8s ease-in-out infinite;
        }
        .glow-ring-1 {
            width: 600px;
            height: 600px;
            top: -200px;
            right: -200px;
            animation-delay: 0s;
        }
        .glow-ring-2 {
            width: 500px;
            height: 500px;
            bottom: -150px;
            left: -150px;
            animation-delay: 4s;
            border-color: rgba(255, 138, 138, 0.05);
        }
        @keyframes ringPulse {
            0% {
                transform: scale(0.9);
                opacity: 0.3;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
            100% {
                transform: scale(0.9);
                opacity: 0.3;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 16px;
            }
            .container {
                gap: 28px;
                padding: 12px;
                min-height: 100vh;
            }
            .shop-card {
                width: min(320px, 94%);
                padding: 20px 18px 22px;
                border-radius: 24px;
            }
            .shop-card img {
                height: 160px;
                border-radius: 16px;
            }
            .shop-title {
                font-size: 19px;
            }
            .shop-subtitle {
                font-size: 14px;
            }
            #cursor-glow {
                display: none;
            }
            .fall:nth-child(n+6) {
                display: none;
            }
            .fall-wide:nth-child(n+12) {
                display: none;
            }
            .cloud-2,
            .cloud-3 {
                display: none;
            }
            .floating-ornament-2,
            .floating-ornament-3 {
                display: none;
            }
            .glow-ring {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .shop-card {
                width: 100%;
                padding: 16px 14px 18px;
            }
            .shop-card img {
                height: 130px;
            }
            .shop-title {
                font-size: 17px;
            }
            .shop-subtitle {
                font-size: 13px;
            }
            .fall:nth-child(n+4) {
                display: none;
            }
            .fall-wide:nth-child(n+11) {
                display: none;
            }
            .mist-layer-2,
            .mist-layer-3 {
                display: none;
            }
            .floating-ornament-1 {
                display: none;
            }
        }

        @media (min-width: 1920px) {
            .shop-card {
                width: 360px;
                padding: 32px 28px 34px;
            }
            .shop-card img {
                height: 230px;
            }
            .shop-title {
                font-size: 26px;
            }
            .shop-subtitle {
                font-size: 18px;
            }
            .container {
                gap: 60px;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }
        * {
            scrollbar-width: none;
        }
    </style>
</head>
<body>

    <div id="bg-layer">
        <div class="sky"></div>
        <div class="aurora"></div>
        <div class="light-rays"></div>
        <div class="clouds">
            <div class="cloud cloud-1"></div>
            <div class="cloud cloud-2"></div>
            <div class="cloud cloud-3"></div>
        </div>
        <div class="waterfall-container">
            <div class="waterfall">
                <div class="fall"></div>
                <div class="fall"></div>
                <div class="fall"></div>
                <div class="fall"></div>
                <div class="fall"></div>
                <div class="fall"></div>
                <div class="fall"></div>
                <div class="fall"></div>
                <div class="fall"></div>
                <div class="fall"></div>
                <div class="fall-wide"></div>
                <div class="fall-wide"></div>
                <div class="fall-wide"></div>
            </div>
        </div>
        <div class="mist">
            <div class="mist-layer mist-layer-1"></div>
            <div class="mist-layer mist-layer-2"></div>
            <div class="mist-layer mist-layer-3"></div>
        </div>
        <div class="ripples">
            <div class="ripple ripple-1"></div>
            <div class="ripple ripple-2"></div>
            <div class="ripple ripple-3"></div>
            <div class="ripple ripple-4"></div>
        </div>
        <div class="reflection"></div>
    </div>

    <div class="floating-ornament floating-ornament-1"></div>
    <div class="floating-ornament floating-ornament-2"></div>
    <div class="floating-ornament floating-ornament-3"></div>

    <div class="glow-ring glow-ring-1"></div>
    <div class="glow-ring glow-ring-2"></div>

    <canvas id="particles-canvas"></canvas>
    <div id="cursor-glow"></div>

    <div class="container">
        <div class="shop-card" onclick="enterShop('glory')">
            <div class="glass-streak"></div>
            <img src="glory.png" alt="Friends Glory Shop">
            <div class="shop-title">FRIENDS GLORY'S SHOP</div>
            <div class="shop-subtitle">மற்றும் ஃபிரெண்ட்ஸ் கிளாரீஸ் கடை</div>
        </div>
    </div>

    <audio id="clickSound" src="sounds/click.mp3" preload="auto"></audio>

    <script>
        (function() {
            'use strict';

            window.enterShop = function(shop) {
                localStorage.setItem("selectedShop", shop);
                var sound = document.getElementById("clickSound");
                if (sound) {
                    sound.currentTime = 0;
                    sound.play().catch(function() {});
                }
                if (shop === "glory") {
                    window.location.href = "stationary.html";
                } else {
                    alert("Unknown shop.");
                }
            };

            var canvas = document.getElementById('particles-canvas');
            var ctx = canvas.getContext('2d');
            var particles = [];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            function getParticleCount() {
                var w = window.innerWidth;
                if (w < 480) return 35;
                if (w < 768) return 60;
                if (w < 1200) return 100;
                return 150;
            }

            function initParticles() {
                var count = getParticleCount();
                particles = [];
                for (var i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        r: 1.0 + Math.random() * 3.5,
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.3 - 0.06,
                        alpha: 0.12 + Math.random() * 0.50,
                        pulseSpeed: 0.004 + Math.random() * 0.018,
                        pulsePhase: Math.random() * Math.PI * 2,
                        sizeVariation: 0.5 + Math.random() * 0.9,
                        hue: 25 + Math.random() * 35,
                    });
                }
            }

            initParticles();

            var resizeTimeout;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(function() {
                    resizeCanvas();
                    initParticles();
                }, 300);
            });

            function drawParticles(time) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                for (var i = 0; i < particles.length; i++) {
                    var p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;

                    if (p.x < -20) p.x = canvas.width + 20;
                    if (p.x > canvas.width + 20) p.x = -20;
                    if (p.y < -20) p.y = canvas.height + 20;
                    if (p.y > canvas.height + 20) p.y = -20;

                    var pulse = Math.sin(time * p.pulseSpeed + p.pulsePhase) * 0.5 + 0.5;
                    var alpha = p.alpha * (0.4 + pulse * 0.6);
                    var radius = p.r * (0.6 + pulse * 0.5) * p.sizeVariation;

                    var grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, radius * 4);
                    var r = 255;
                    var g = 170 + Math.sin(time * 0.008 + p.pulsePhase) * 40;
                    var b = 90 + Math.sin(time * 0.012 + p.pulsePhase * 1.3) * 50;

                    grad.addColorStop(0, 'rgba(' + r + ',' + Math.round(g) + ',' + Math.round(b) + ',' + alpha + ')');
                    grad.addColorStop(0.3, 'rgba(' + r + ',' + Math.round(g * 0.75) + ',' + Math.round(b * 0.55) + ',' +
                        alpha * 0.45 + ')');
                    grad.addColorStop(1, 'rgba(255,200,150,0)');

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, radius * 4, 0, Math.PI * 2);
                    ctx.fillStyle = grad;
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, radius * 0.5, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,245,' + (alpha * 0.65) + ')';
                    ctx.fill();

                    ctx.beginPath();
                    ctx.arc(p.x, p.y, radius * 0.12, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,' + (alpha * 0.45) + ')';
                    ctx.fill();
                }

                requestAnimationFrame(drawParticles);
            }

            requestAnimationFrame(drawParticles);

            var cursorGlow = document.getElementById('cursor-glow');
            var cards = document.querySelectorAll('.shop-card');
            var isMobile = window.innerWidth < 768;

            if (!isMobile) {
                document.addEventListener('mousemove', function(e) {
                    cursorGlow.style.left = e.clientX + 'px';
                    cursorGlow.style.top = e.clientY + 'px';
                    cursorGlow.classList.add('visible');
                });
                document.addEventListener('mouseleave', function() {
                    cursorGlow.classList.remove('visible');
                });
            } else {
                cursorGlow.style.display = 'none';
            }

            cards.forEach(function(card) {
                card.addEventListener('mousemove', function(e) {
                    if (isMobile) return;
                    var rect = card.getBoundingClientRect();
                    var x = e.clientX - rect.left;
                    var y = e.clientY - rect.top;
                    var centerX = rect.width / 2;
                    var centerY = rect.height / 2;
                    var rotateX = ((y - centerY) / centerY) * -10;
                    var rotateY = ((x - centerX) / centerX) * 10;
                    card.style.transform =
                        'translateY(-18px) scale(1.05) rotateX(' + rotateX + 'deg) rotateY(' + rotateY + 'deg)';
                    card.style.transition = 'transform 0.15s cubic-bezier(0.21, 0.8, 0.33, 1)';
                });

                card.addEventListener('mouseleave', function() {
                    if (isMobile) return;
                    card.style.transform = '';
                    card.style.transition = 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
                });
            });

            window.addEventListener('resize', function() {
                var nowMobile = window.innerWidth < 768;
                if (nowMobile !== isMobile) {
                    isMobile = nowMobile;
                    if (isMobile) {
                        cursorGlow.style.display = 'none';
                        cursorGlow.classList.remove('visible');
                        cards.forEach(function(c) {
                            c.style.transform = '';
                        });
                    } else {
                        cursorGlow.style.display = 'block';
                    }
                }
            });
        })();
    </script>

</body>
</html>
